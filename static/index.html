<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Desk — College Assistant</title>
  <link rel="icon" href="../assets/icon/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="desk">
    <header class="desk__header">
      <div class="desk__brand">
        <img src="/assets/icon/app.svg" alt="" class="desk__crest" />
        <div>
          <h1>Campus Desk</h1>
          <p class="desk__tagline">Academics &amp; fees, answered</p>
        </div>
      </div>

      <label class="desk__programme">
        <span>Programme</span>
        <select id="programme-select">
          <option value="BCA">BCA</option>
          <option value="BBA">BBA</option>
          <option value="BCOM_H">B.Com (H)</option>
        </select>
      </label>
    </header>

    <main id="chat-log" class="chat-log" aria-live="polite">
      <div class="msg msg--bot">
        <div class="msg__card">
          Hi, I'm your college assistant. Ask me about attendance, exams, fees, refunds — or anything else on your mind.
        </div>
      </div>
    </main>

    <div id="typing-indicator" class="typing" hidden>
      <span></span><span></span><span></span>
    </div>

    <form id="chat-form" class="composer">
      <input
        id="chat-input"
        type="text"
        placeholder="Ask about attendance, fees, exams…"
        autocomplete="off"
        maxlength="500"
      />
      <button type="submit" id="send-btn">Send</button>
    </form>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
